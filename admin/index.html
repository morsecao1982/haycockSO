<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Haycock Science Olympiad</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { min-height: 100vh; }
  #login-view { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  #dashboard-view { display: none; }

  .filter-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-bar input, .filter-bar select {
    padding: 8px 12px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
  }
  .filter-bar input { flex: 1; min-width: 200px; }
  .events-cell { display: flex; flex-wrap: wrap; gap: 4px; }
  .no-results { text-align: center; padding: 40px; color: var(--text-light); font-size: 15px; }
  .admin-topbar {
    background: var(--primary-dark);
    color: white;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .admin-topbar h1 { font-size: 18px; font-weight: 700; margin-right: auto; }
  .admin-topbar a { color: rgba(255,255,255,0.7); font-size: 13px; text-decoration: none; }
  .admin-topbar a:hover { color: white; }
  #logout-btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  #logout-btn:hover { background: rgba(255,255,255,0.22); }
</style>
</head>
<body>

<!-- ── LOGIN VIEW ── -->
<div id="login-view">
  <div class="form-card" style="max-width: 400px; width: 100%;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="font-size: 36px; margin-bottom: 8px;">🏆</div>
      <h2 style="font-size: 22px; font-weight: 800; color: var(--primary);">Admin Login</h2>
      <p style="font-size: 14px; color: var(--text-light); margin-top: 6px;">Haycock Science Olympiad</p>
    </div>

    <div id="login-error" class="form-alert error" style="display:none"></div>

    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" required placeholder="admin@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn" style="width:100%;padding:13px;font-size:15px;">
        Sign In
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-light);">
      <a href="../index.html" style="color: var(--primary);">← Back to site</a>
    </p>
  </div>
</div>

<!-- ── DASHBOARD VIEW ── -->
<div id="dashboard-view">
  <div class="admin-topbar">
    <h1>🏆 Haycock SO — Admin Dashboard</h1>
    <a href="../index.html">View Site</a>
    <button id="logout-btn" onclick="logout()">Sign Out</button>
  </div>

  <div class="section">
    <div class="section-inner">

      <!-- STATS -->
      <div class="admin-stats" id="stats-row">
        <div class="stat-card">
          <div class="stat-num" id="stat-total">—</div>
          <div class="stat-label">Total Submissions</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-new">—</div>
          <div class="stat-label">New (last 7 days)</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-5th">—</div>
          <div class="stat-label">5th Graders</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-6th">—</div>
          <div class="stat-label">6th Graders</div>
        </div>
      </div>

      <!-- FILTER + EXPORT -->
      <div class="filter-bar">
        <input type="text" id="search-input" placeholder="Search by name or email…">
        <select id="grade-filter">
          <option value="">All Grades</option>
          <option value="5th">5th Grade</option>
          <option value="6th">6th Grade</option>
        </select>
        <button class="btn btn-primary" onclick="exportCSV()" style="padding:8px 18px;font-size:14px;">
          ⬇ Export CSV
        </button>
      </div>

      <!-- TABLE -->
      <div class="table-wrap">
        <table id="submissions-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Student 1</th>
              <th>Grade</th>
              <th>Student 2</th>
              <th>Grade</th>
              <th>Parent 1 Email</th>
              <th>Parent 1 Phone</th>
              <th>Parent 2 Email</th>
              <th>Parent 2 Phone</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="10" class="no-results">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <p id="row-count" style="font-size:13px;color:var(--text-light);margin-top:12px;"></p>

    </div>
  </div>
</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script src="../js/config.js"></script>
<script>
let allRows = [];

// ── AUTH CHECK ON LOAD ──────────────────────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) showDashboard();
})();

db.auth.onAuthStateChange((event, session) => {
  if (session) showDashboard();
  else showLogin();
});

// ── LOGIN ───────────────────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  const { error } = await db.auth.signInWithPassword({
    email:    document.getElementById('login-email').value,
    password: document.getElementById('login-password').value,
  });

  if (error) {
    errEl.style.display = 'block';
    errEl.textContent = error.message;
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
  // onAuthStateChange fires and calls showDashboard() on success
});

async function logout() {
  await db.auth.signOut();
}

// ── VIEWS ────────────────────────────────────────────────────────
function showLogin() {
  document.getElementById('login-view').style.display = 'flex';
  document.getElementById('dashboard-view').style.display = 'none';
}
function showDashboard() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('dashboard-view').style.display = 'block';
  loadSubmissions();
}

// ── LOAD DATA ────────────────────────────────────────────────────
async function loadSubmissions() {
  const { data, error } = await db
    .from('interest_submissions')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('table-body').innerHTML =
      `<tr><td colspan="10" class="no-results" style="color:var(--error);">Error: ${error.message}</td></tr>`;
    return;
  }

  allRows = data || [];
  updateStats(allRows);
  renderTable(allRows);

  document.getElementById('search-input').addEventListener('input', applyFilters);
  document.getElementById('grade-filter').addEventListener('change', applyFilters);
}

function applyFilters() {
  const q     = document.getElementById('search-input').value.toLowerCase();
  const grade = document.getElementById('grade-filter').value;

  const filtered = allRows.filter(r => {
    const text = `${r.student1_name} ${r.student2_name||''} ${r.parent1_email} ${r.parent2_email||''}`.toLowerCase();
    if (q && !text.includes(q)) return false;
    if (grade && r.student1_grade !== grade && r.student2_grade !== grade) return false;
    return true;
  });
  renderTable(filtered);
}

function updateStats(rows) {
  const sevenDaysAgo = new Date(Date.now() - 7*24*3600*1000).toISOString();
  // count individual students (student2 optional)
  const all5th = rows.filter(r => r.student1_grade === '5th' || r.student2_grade === '5th').length;
  const all6th = rows.filter(r => r.student1_grade === '6th' || r.student2_grade === '6th').length;

  document.getElementById('stat-total').textContent = rows.length;
  document.getElementById('stat-new').textContent   = rows.filter(r => r.created_at >= sevenDaysAgo).length;
  document.getElementById('stat-5th').textContent   = all5th;
  document.getElementById('stat-6th').textContent   = all6th;
}

function renderTable(rows) {
  const tbody = document.getElementById('table-body');
  document.getElementById('row-count').textContent =
    `Showing ${rows.length} of ${allRows.length} submission${allRows.length !== 1 ? 's' : ''}`;

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" class="no-results">No submissions found.</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map((r, i) => `
    <tr>
      <td style="color:var(--text-light);font-size:13px;">${i + 1}</td>
      <td><strong>${esc(r.student1_name)}</strong></td>
      <td><span class="badge badge-blue">${esc(r.student1_grade)}</span></td>
      <td>${r.student2_name ? `<strong>${esc(r.student2_name)}</strong>` : '<span style="color:var(--text-light)">—</span>'}</td>
      <td>${r.student2_grade ? `<span class="badge badge-blue">${esc(r.student2_grade)}</span>` : '—'}</td>
      <td><a href="mailto:${esc(r.parent1_email)}" style="color:var(--primary);">${esc(r.parent1_email)}</a></td>
      <td style="white-space:nowrap;">${esc(r.parent1_phone)}</td>
      <td>${r.parent2_email ? `<a href="mailto:${esc(r.parent2_email)}" style="color:var(--primary);">${esc(r.parent2_email)}</a>` : '—'}</td>
      <td style="white-space:nowrap;">${r.parent2_phone ? esc(r.parent2_phone) : '—'}</td>
      <td style="white-space:nowrap;font-size:13px;color:var(--text-light);">${formatDate(r.created_at)}</td>
    </tr>
  `).join('');
}

// ── CSV EXPORT ───────────────────────────────────────────────────
function exportCSV() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const grade = document.getElementById('grade-filter').value;
  const ret = document.getElementById('returning-filter').value;
  const search = document.getElementById('search-input').value.toLowerCase();
  const grade  = document.getElementById('grade-filter').value;
  const rows = allRows.filter(r => {
    const text = `${r.student1_name} ${r.student2_name||''} ${r.parent1_email} ${r.parent2_email||''}`.toLowerCase();
    if (search && !text.includes(search)) return false;
    if (grade && r.student1_grade !== grade && r.student2_grade !== grade) return false;
    return true;
  });

  const cols = ['student1_name','student1_grade','student2_name','student2_grade','parent1_email','parent1_phone','parent2_email','parent2_phone','created_at'];
  const header = cols.join(',');
  const csvRows = rows.map(r =>
    cols.map(c => `"${String(r[c] ?? '').replace(/"/g, '""')}"`).join(',')
  );

  const blob = new Blob([header + '\n' + csvRows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `haycock-so-interest-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── HELPERS ──────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
</script>

<script src="../js/nav.js"></script>
</body>
</html>
